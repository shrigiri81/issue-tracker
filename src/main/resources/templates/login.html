<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Issue Tracker</title>
    <meta name="description" content="Sign in to Issue Tracker">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-card-header">
            <div class="auth-logo">🐞</div>
            <h1>Welcome back</h1>
            <p>Sign in to your Issue Tracker account</p>
        </div>

        <div class="auth-card-body">

            <!-- Error alert -->
            <div th:if="${param.error}" class="alert alert-error">
                ✗ Invalid username or password. Please try again.
            </div>

            <!-- Logout confirmation -->
            <div th:if="${param.logout}" class="alert alert-success">
                ✓ You've been signed out successfully.
            </div>

            <!-- Success flash (after register) -->
            <div th:if="${success}" class="alert alert-success">
                ✓ <span th:text="${success}"></span>
            </div>

            <!-- Login Form (Spring Security processes POST /login) -->
            <form th:action="@{/login}" method="post" style="display:flex;flex-direction:column;gap:14px">

                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input id="username" name="username" type="text" class="form-control"
                           placeholder="your-username" autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" name="password" type="password" class="form-control"
                           placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <button id="login-submit" type="submit" class="btn btn-primary btn-lg w-full"
                        style="margin-top:4px;justify-content:center">
                    Sign in
                </button>

            </form>

            <div class="auth-footer">
                Don't have an account?
                <a th:href="@{/register}">Create one</a>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
