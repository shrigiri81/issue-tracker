<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account · Issue Tracker</title>
    <meta name="description" content="Register a new Issue Tracker account">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-card-header">
            <div class="auth-logo">🐞</div>
            <h1>Create account</h1>
            <p>Join your team on Issue Tracker</p>
        </div>

        <div class="auth-card-body">

            <!-- Error flash -->
            <div th:if="${error}" class="alert alert-error">
                ✗ <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" method="post"
                  style="display:flex;flex-direction:column;gap:14px">

                <div class="form-group">
                    <label class="form-label" for="reg-username">Username</label>
                    <input id="reg-username" name="username" type="text" class="form-control"
                           placeholder="your-username" autocomplete="username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email</label>
                    <input id="reg-email" name="email" type="email" class="form-control"
                           placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input id="reg-password" name="password" type="password" class="form-control"
                           placeholder="••••••••" autocomplete="new-password" required>
                </div>

                <button id="register-submit" type="submit" class="btn btn-primary btn-lg w-full"
                        style="margin-top:4px;justify-content:center">
                    Create account
                </button>

            </form>

            <div class="auth-footer">
                Already have an account?
                <a th:href="@{/login}">Sign in</a>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
